services:
  mysql:
    image: mysql:8.0
    container_name: population-report-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-world}
      MYSQL_USER: ${DB_USER:-appuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-apppassword}
    ports:
      - "3306:3306"
    volumes:
      - ./database/world.sql:/docker-entrypoint-initdb.d/world.sql:ro
      - mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: population-report-app
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: world
      DB_USER: appuser
      DB_PASSWORD: apppassword

volumes:
  mysql_data: