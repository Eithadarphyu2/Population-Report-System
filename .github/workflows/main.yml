name: Java CI with Maven and Docker

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - "master"
      - "develop"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: world
          MYSQL_USER: appuser
          MYSQL_PASSWORD: apppassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

      # Step 3: Initialize MySQL schema and test data into container
      - name: Initialize MySQL schema and test data
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client
          mysql \
            --protocol=TCP \
            --host=127.0.0.1 \
            --port=3306 \
            --user=appuser \
            --password=apppassword \
            world < database/world.sql

      # Step 4: Run Maven Unit & Integration Tests
      - name: Build and Run Tests with Maven
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: world
          DB_USER: appuser
          DB_PASSWORD: apppassword
        run: mvn clean package

      # Step 5: Verify Docker Image Build
      - name: Build Docker Image
        run: docker build -t population-report-system:latest .