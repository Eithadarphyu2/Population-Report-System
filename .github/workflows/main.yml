name: Java CI with Maven and Docker Compose

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - master
      - develop

jobs:

  build-and-test:
    name: Build, Test and Docker Compose
    runs-on: ubuntu-latest

    steps:

      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # Set up Java 26
      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

      # Build the application JAR without running tests
      - name: Build application with Maven
        run: mvn clean package -DskipTests

      # Start MySQL and the application containers
      - name: Start Docker Compose
        run: docker compose up -d --build

      # Run Maven integration tests
      - name: Run integration tests
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: world
          DB_USER: appuser
          DB_PASSWORD: apppassword
        run: mvn test

      # Show container logs if a step fails
      - name: Show Docker logs
        if: failure()
        run: docker compose logs

      # Stop containers and remove resources
      - name: Clean up Docker Compose
        if: always()
        run: docker compose down -v