name: Java CI with Maven and Docker

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - "master"
      - "develop"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      # MySQL service container for unit and integration testing
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: world
          MYSQL_USER: appuser
          MYSQL_PASSWORD: apppassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # Step 1: Checkout repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Java Development Kit (JDK) 26
      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'

      # Step 3: Run Maven tests if pom.xml is present
      - name: Build and Run Tests with Maven
        run: |
          if [ -f "pom.xml" ]; then
            mvn clean test
          else
            echo "pom.xml not found on this branch. Skipping Maven build."
          fi
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: world
          DB_USER: appuser
          DB_PASSWORD: apppassword

      # Step 4: Package JAR artifact
      - name: Package Application JAR
        run: |
          if [ -f "pom.xml" ]; then
            mvn package -DskipTests
          else
            echo "pom.xml not found on this branch. Skipping packaging."
          fi

      # Step 5: Build Docker container image
      - name: Build Docker Image
        run: docker build -t population-report-system:latest .
